[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-dataset-workbench"
version = "0.1.0"
description = "Offline USB camera acquisition and experiment image archiving workbench"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<7", "PySide6-Fluent-Widgets>=1.7,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyinstaller>=6,<7"]

[project.scripts]
image-workbench = "workbench.app:main"

[tool.hatch.build.targets.wheel]
packages = ["workbench"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/native_smoke.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
